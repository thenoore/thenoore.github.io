function initMobileMenu() {
    const menu = document.getElementById("menu");

    const overlay = document.getElementById("menuOverlay");

    if (!menu || !btn || !overlay) return;

    function closeMenu() {
        menu.classList.remove("show");
        overlay.classList.remove("show");
        btn.classList.remove("is-open");
        btn.setAttribute("aria-expanded", "false");
    }

    btn.addEventListener("click", (e) => {
        e.stopPropagation();

        const isOpen = menu.classList.contains("show");

        if (isOpen) {
            closeMenu();
        } else {
            menu.classList.add("show");
            overlay.classList.add("show");
            btn.classList.add("is-open");
            btn.setAttribute("aria-expanded", "true");
        }
    });

    overlay.addEventListener("click", closeMenu);

    menu.addEventListener("click", (e) => {
        e.stopPropagation();
    });
}

document.addEventListener("astro:page-load", initMobileMenu);
document.addEventListener("astro:after-swap", initMobileMenu);

function initShopStagger() {

    const isLandscape = window.matchMedia("(orientation: landscape)").matches;
    const finePointer = window.matchMedia("(pointer: fine)").matches;

    if (!isLandscape || !finePointer) return;
    
    const cards = Array.from(document.querySelectorAll(".card"));

    const observer = new IntersectionObserver(
        (entries) => {
            entries.forEach((entry) => {
                if (!entry.isIntersecting) return;

                const index = cards.indexOf(entry.target);

                // stagger based on index
                entry.target.style.transitionDelay = `${index * 400}ms`;

                entry.target.classList.remove("is-hidden");
                entry.target.classList.add("visible");

                observer.unobserve(entry.target);
            });
        },
        {
            rootMargin: "0px 0px -10% 0px"
        }
    );

    cards.forEach((card) => observer.observe(card));
}

document.addEventListener("astro:page-load", initShopStagger);
document.addEventListener("astro:after-swap", initShopStagger);
</script>
